server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version to scanners.
    server_tokens off;

    # ------------------------------------------------------------------
    # Security response headers
    #
    # `add_header` does NOT merge across levels: a location block that sets any
    # header of its own discards every one inherited from here. That is why the
    # /assets/ block below repeats the whole set instead of adding only
    # Cache-Control. Check with `curl -I` after editing either place.
    # ------------------------------------------------------------------

    # Everything the bundle needs is served from this origin; the only outbound
    # connection is to the API. Update connect-src if VITE_API_BASE_URL changes.
    #
    # 'unsafe-inline' in style-src is required because Recharts renders inline
    # style attributes on the SVG it generates. Note that scripts are NOT given
    # the same latitude — script-src stays 'self', which is what actually blocks
    # injected JavaScript.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.vakhim-dev.site; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Ignored by browsers over plain HTTP. It applies once the TLS terminator in
    # front of this container serves the site over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Repeated deliberately — see the note above.
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Dotfiles must never be served. A stray .env or .git in the image would
    # otherwise be a straight credential leak.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
